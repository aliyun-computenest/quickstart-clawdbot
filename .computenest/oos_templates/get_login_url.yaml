FormatVersion: OOS-2019-06-01
Description:
  en: Generate a one-time login link for the OpenClaw console
  zh-cn: 生成 OpenClaw 控制台的一次性登录链接
Parameters:
  regionId:
    Type: String
    Label:
      en: RegionId
      zh-cn: 地域ID
    AssociationProperty: RegionId
    Default: '{{ ACS::RegionId }}'
  targets:
    Type: Json
    Label:
      en: TargetInstance
      zh-cn: 目标实例
    AssociationProperty: Targets
    AssociationPropertyMetadata:
      ResourceType: ALIYUN::ECS::Instance
      RegionId: regionId
Tasks:
  - Name: getInstance
    Description:
      en: Views the ECS instances
      zh-cn: 获取ECS实例
    Action: ACS::SelectTargets
    Properties:
      ResourceType: ALIYUN::ECS::Instance
      RegionId: '{{ regionId }}'
      Filters:
        - '{{ targets }}'
    Outputs:
      InstanceId:
        Type: String
        ValueSelector: Instances.Instance[].InstanceId
      OSType:
        Type: String
        ValueSelector: Instances.Instance[].OSType
  - Name: GetLoginUrlByRunCommand
    When:
      Fn::Equals:
        - '{{ getInstance.OSType }}'
        - linux
    Action: ACS::ECS::RunCommand
    Description:
      en: Generate the one-time login link by run command
      zh-cn: 通过执行命令生成一次性登录链接
    Properties:
      regionId: '{{ regionId }}'
      instanceId: '{{ getInstance.InstanceId }}'
      commandType: RunShellScript
      commandContent: |-
        #!/bin/bash
        sh /opt/.swas/run-cmd.sh get-login-url
    Outputs:
      loginUrl:
        Type: String
        ValueSelector: invocationOutput
Outputs:
  loginUrl:
    Type: String
    Label:
      en: One-time login link
      zh-cn: 一次性登录链接
    Value: '{{ GetLoginUrlByRunCommand.loginUrl }}'
