FormatVersion: OOS-2019-06-01
Description:
  en: Retrieve the OpenClaw console login link
  zh-cn: 获取 OpenClaw 控制台登录链接
Parameters:
  regionId:
    Type: String
    Label:
      en: RegionId
      zh-cn: 地域ID
    AssociationProperty: RegionId
    Default: '{{ ACS::RegionId }}'
  targets:
    Type: Json
    Label:
      en: TargetInstance
      zh-cn: 目标实例
    AssociationProperty: Targets
    AssociationPropertyMetadata:
      ResourceType: ALIYUN::ECS::Instance
      RegionId: regionId
Tasks:
  - Name: getInstance
    Description:
      en: Views the ECS instances
      zh-cn: 获取ECS实例
    Action: ACS::SelectTargets
    Properties:
      ResourceType: ALIYUN::ECS::Instance
      RegionId: '{{ regionId }}'
      Filters:
        - '{{ targets }}'
    Outputs:
      InstanceId:
        Type: String
        ValueSelector: Instances.Instance[].InstanceId
      OSType:
        Type: String
        ValueSelector: Instances.Instance[].OSType
  - Name: GetLoginUrlByRunCommand
    When:
      Fn::Equals:
        - '{{ getInstance.OSType }}'
        - linux
    Action: ACS::ECS::RunCommand
    Description:
      en: Retrieve the console login link by run command
      zh-cn: 通过执行命令获取控制台登录链接
    Properties:
      regionId: '{{ regionId }}'
      instanceId: '{{ getInstance.InstanceId }}'
      commandType: RunShellScript
      # 不用 get-login-url 打印的一次性链接：它带 gatewayUrl=ws://127.0.0.1:18789，浏览器会
      # 去连自己本机的 WebSocket，实测打不开，而且只有 10 分钟、仅能用一次。这里把地址和令牌
      # 拼成 <控制台地址>/#token=<访问令牌>，令牌不变即长期有效，配合实例上的 openclaw-autopair
      # 守护进程（自动批准设备配对）打开即可直接进入。
      # 提取时按数据特征而不是中文标签取值，不依赖镜像里的文案。
      commandContent: |-
        #!/bin/bash
        o=$(sh /opt/.swas/run-cmd.sh get-url 2>&1)
        c=$(printf '%s\n' "$o" | grep -om1 'http://[0-9.]*:[0-9]*')
        t=$(printf '%s\n' "$o" | grep -om1 '[0-9a-f]\{32,\}')
        if [ -z "$c" ] || [ -z "$t" ]; then
          echo "获取失败，请在实例内查看 /var/log/openclaw-deploy.log"
          exit 0
        fi
        echo "登录链接: $c/#token=$t"
        echo "控制台地址: $c"
        echo "访问令牌: $t"
        echo "在浏览器打开登录链接即可进入控制台，链接长期有效，换浏览器或换电脑同样可用。"
        echo "打开时若短暂出现「批准此浏览器」页面，无需操作，几秒后会自动进入。"
        systemctl is-active --quiet openclaw-autopair \
          || echo "提示: 自动配对服务未运行，请在本实例执行 systemctl start openclaw-autopair 后重试。"
    Outputs:
      loginUrl:
        Type: String
        ValueSelector: invocationOutput
Outputs:
  loginUrl:
    Type: String
    Label:
      en: Console login link
      zh-cn: 控制台登录链接
    Value: '{{ GetLoginUrlByRunCommand.loginUrl }}'
